<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="160" y1="0" x2="1760" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101e" />
      <stop offset="0.48" stop-color="#05070f" />
      <stop offset="1" stop-color="#0a0714" />
    </linearGradient>
    <linearGradient id="orbit" x1="960" y1="0" x2="1300" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.05" />
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.65" />
      <stop offset="0.7" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="planet" cx="0" cy="0" r="1" gradientTransform="translate(1260 360) rotate(46) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5f3fc" />
      <stop offset="0.32" stop-color="#38bdf8" />
      <stop offset="0.72" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#1e1b4b" />
    </radialGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1240 380) rotate(90) scale(520 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(230 920) rotate(-90) scale(520 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed" stop-opacity="0.26" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1" />
    </pattern>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1920" height="1080" fill="url(#grid-fade)" />
    </mask>
    <filter id="blur-100" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
    <filter id="blur-18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#grid-mask)" />
  <rect width="1920" height="1080" fill="url(#halo)" />
  <rect width="1920" height="1080" fill="url(#violet)" />

  <g transform="rotate(-24 1260 380)">
    <ellipse cx="1260" cy="380" rx="620" ry="190" fill="none" stroke="url(#orbit)" stroke-width="9" opacity="0.65" />
    <ellipse cx="1260" cy="380" rx="760" ry="242" fill="none" stroke="url(#orbit)" stroke-width="2.5" opacity="0.45" />
    <ellipse cx="1260" cy="380" rx="500" ry="150" fill="none" stroke="url(#orbit)" stroke-width="2" opacity="0.3" />
  </g>

  <circle cx="1260" cy="380" r="184" fill="url(#planet)" />
  <circle cx="1260" cy="380" r="184" fill="none" stroke="#bae6fd" stroke-opacity="0.24" stroke-width="2" />
  <ellipse cx="1210" cy="318" rx="74" ry="42" transform="rotate(-28 1210 318)" fill="#e0f2fe" opacity="0.32" filter="url(#blur-18)" />
  <circle cx="1750" cy="130" r="16" fill="#e0f2fe" opacity="0.8" />
  <circle cx="1750" cy="130" r="42" fill="#67e8f9" opacity="0.12" />

  <ellipse cx="330" cy="980" rx="480" ry="260" fill="#0e7490" opacity="0.16" filter="url(#blur-100)" />

  <g fill="#e0f2fe">
    <circle cx="170" cy="180" r="2.4" opacity="0.55" />
    <circle cx="460" cy="90" r="1.6" opacity="0.4" />
    <circle cx="740" cy="230" r="2" opacity="0.5" />
    <circle cx="980" cy="120" r="1.5" opacity="0.35" />
    <circle cx="1620" cy="270" r="2" opacity="0.45" />
    <circle cx="1840" cy="620" r="1.8" opacity="0.4" />
    <circle cx="230" cy="680" r="1.6" opacity="0.4" />
    <circle cx="620" cy="900" r="2.2" opacity="0.4" />
    <circle cx="1080" cy="930" r="1.6" opacity="0.35" />
    <circle cx="1520" cy="860" r="2" opacity="0.4" />
  </g>

  <rect width="1920" height="1080" fill="url(#bg)" opacity="0.15" />
</svg>
