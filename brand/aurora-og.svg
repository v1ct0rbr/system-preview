<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070a14" />
      <stop offset="0.55" stop-color="#05060f" />
      <stop offset="1" stop-color="#080614" />
    </linearGradient>
    <radialGradient id="og-cyan" cx="0" cy="0" r="1" gradientTransform="translate(520 -80) rotate(90) scale(480 640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-violet" cx="0" cy="0" r="1" gradientTransform="translate(1140 590) rotate(-140) scale(480 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-mark" x1="13" y1="51" x2="51" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.52" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="og-core" cx="0" cy="0" r="1" gradientTransform="translate(30 30) rotate(48) scale(8)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.32" stop-color="#a5f3fc" />
      <stop offset="1" stop-color="#38bdf8" />
    </radialGradient>
    <linearGradient id="og-title" x1="80" y1="290" x2="700" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#f1f5f9" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="og-line" x1="0" y1="0" x2="368" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.7" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="og-card" x1="752" y1="212" x2="1120" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.025" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.045" />
    </linearGradient>
    <linearGradient id="og-card-edge" x1="752" y1="212" x2="1120" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5f3fc" stop-opacity="0.35" />
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>
    <pattern id="og-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <radialGradient id="og-grid-fade" cx="0" cy="0" r="1" gradientTransform="translate(600 300) rotate(90) scale(440 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="og-grid-mask">
      <rect width="1200" height="630" fill="url(#og-grid-fade)" />
    </mask>
    <filter id="og-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-cyan)" />
  <rect width="1200" height="630" fill="url(#og-violet)" />
  <rect width="1200" height="630" fill="url(#og-grid)" mask="url(#og-grid-mask)" />
  <circle cx="1160" cy="70" r="170" fill="#7c3aed" opacity="0.1" filter="url(#og-soft)" />
  <circle cx="80" cy="580" r="150" fill="#0891b2" opacity="0.09" filter="url(#og-soft)" />

  <g transform="translate(80 76)">
    <rect width="52" height="52" rx="13" fill="#0b1122" />
    <rect x="0.6" y="0.6" width="50.8" height="50.8" rx="12.4" fill="none" stroke="#ffffff" stroke-opacity="0.14" />
    <g transform="scale(0.8125)">
      <circle cx="32" cy="34" r="24" fill="#22d3ee" opacity="0.12" />
      <ellipse cx="32" cy="34" rx="17" ry="7" transform="rotate(-30 32 34)" fill="none" stroke="url(#og-mark)" stroke-width="3.4" stroke-linecap="round" />
      <circle cx="32" cy="33" r="6.6" fill="url(#og-core)" />
      <circle cx="32" cy="33" r="2.1" fill="#ffffff" />
      <circle cx="46.1" cy="22.7" r="2.5" fill="#e0f2fe" />
    </g>
  </g>
  <text x="150" y="101" font-family="Space Grotesk" font-size="22" font-weight="600" letter-spacing="5.5" fill="#e2e8f0">AURORA</text>
  <text x="151" y="118" font-family="JetBrains Mono" font-size="9.5" font-weight="500" letter-spacing="2.6" fill="#64748b">DEVELOPMENT PREVIEW</text>

  <g>
    <rect x="920" y="78" width="200" height="38" rx="19" fill="#22d3ee" fill-opacity="0.07" stroke="#67e8f9" stroke-opacity="0.22" />
    <circle cx="945" cy="97" r="4" fill="#67e8f9" />
    <circle cx="945" cy="97" r="8" fill="#67e8f9" opacity="0.18" />
    <text x="962" y="102" font-family="Space Grotesk" font-size="12" font-weight="600" letter-spacing="3.1" fill="#a5f3fc">EM BREVE</text>
  </g>

  <circle cx="83" cy="234" r="3.5" fill="#22d3ee" />
  <circle cx="83" cy="234" r="8" fill="#22d3ee" opacity="0.18" />
  <text x="99" y="239" font-family="Space Grotesk" font-size="14" font-weight="500" letter-spacing="4.4" fill="#67e8f9">PRÉVIA DE DESENVOLVIMENTO</text>

  <text x="76" y="382" font-family="Space Grotesk" font-size="138" font-weight="600" letter-spacing="-5" fill="url(#og-title)">Aurora</text>

  <text x="80" y="446" font-family="Space Grotesk" font-size="25" font-weight="400" letter-spacing="-0.2" fill="#94a3b8">Uma nova experiência para gerenciar, acompanhar</text>
  <text x="80" y="482" font-family="Space Grotesk" font-size="25" font-weight="400" letter-spacing="-0.2" fill="#94a3b8">e evoluir todas as suas operações.</text>

  <g>
    <circle cx="86" cy="563" r="3.5" fill="#34d399" />
    <text x="100" y="568" font-family="Space Grotesk" font-size="14" font-weight="500" letter-spacing="0.2" fill="#64748b">Sistema em desenvolvimento · Ambiente de prévia</text>
  </g>

  <g>
    <rect x="752" y="212" width="368" height="300" rx="30" fill="url(#og-card)" stroke="url(#og-card-edge)" />
    <rect x="752" y="212" width="368" height="300" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
    <circle cx="784" cy="254" r="3.5" fill="#67e8f9" />
    <text x="798" y="259" font-family="Space Grotesk" font-size="10.5" font-weight="600" letter-spacing="3.4" fill="#94a3b8">CONTAGEM REGRESSIVA</text>

    <text x="936" y="356" text-anchor="middle" font-family="JetBrains Mono" font-size="47" font-weight="500" letter-spacing="2" fill="#f8fafc" fill-opacity="0.88">--:--:--</text>

    <text x="852" y="386" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="600" letter-spacing="2.2" fill="#64748b">HORAS</text>
    <text x="936" y="386" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="600" letter-spacing="2.2" fill="#64748b">MINUTOS</text>
    <text x="1020" y="386" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="600" letter-spacing="2.2" fill="#64748b">SEGUNDOS</text>

    <line x1="784" y1="414" x2="1088" y2="414" stroke="#ffffff" stroke-opacity="0.07" />

    <text x="936" y="452" text-anchor="middle" font-family="Space Grotesk" font-size="13.5" font-weight="400" fill="#94a3b8">O acesso será liberado em breve</text>

    <rect x="784" y="484" width="304" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06" />
    <rect x="784" y="484" width="124" height="3" rx="1.5" fill="url(#og-line)" />
  </g>

  <line x1="80" y1="600" x2="1120" y2="600" stroke="#ffffff" stroke-opacity="0.07" />
  <text x="80" y="620" font-family="JetBrains Mono" font-size="8.5" font-weight="500" letter-spacing="2.2" fill="#475569">LANÇAMENTO EM BREVE · ACESSO ANTECIPADO</text>
  <text x="1120" y="620" text-anchor="end" font-family="JetBrains Mono" font-size="8.5" font-weight="500" letter-spacing="2.2" fill="#475569">AURORA © 2026</text>
</svg>
