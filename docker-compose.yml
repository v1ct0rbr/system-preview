name: system-preview

services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile
    image: system-preview:local
    container_name: system-preview
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      SYSTEM_NAME: "${SYSTEM_NAME:-Aurora}"
      SYSTEM_DESCRIPTION: "${SYSTEM_DESCRIPTION:-Uma nova experiência para gerenciar, acompanhar e evoluir suas operações — em um só lugar.}"
      SYSTEM_START_DATE: "${SYSTEM_START_DATE:-2026-12-20T09:00:00-03:00}"
      SYSTEM_URL: "${SYSTEM_URL:-}"
      SYSTEM_BACKGROUND_DIRS: "${SYSTEM_BACKGROUND_DIRS:-/backgrounds}"
    restart: unless-stopped
    # Para usar imagens extras sem recriar a imagem Docker, monte o diretório
    # dentro do web root e informe o caminho em SYSTEM_BACKGROUND_DIRS:
    # volumes:
    #   - ./minhas-imagens:/usr/share/nginx/html/backgrounds/extra:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
